<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı – Mustafa Tümüklü</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { --zemin: #F5F7F5; --murekkep: #16211C; --soluk: #55645C; --vurgu: #0D6A4C; }
@media (prefers-color-scheme: dark) { :root { --zemin: #0F1714; --murekkep: #E3EBE6; --soluk: #98A79F; --vurgu: #5EC79B; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: .75rem; padding: 2rem max(16px, env(safe-area-inset-left, 0px));
  background: var(--zemin); color: var(--murekkep); font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
h1 { font-size: 1.75rem; margin: 0; }
p { margin: 0; color: var(--soluk); }
a { color: var(--vurgu); }
</style>
</head>
<body>
<h1>Bu sayfa bulunamadı</h1>
<p>Adres yanlış yazılmış ya da dosya kaldırılmış olabilir.</p>
<p><a href="/">Ana sayfaya dön</a></p>
</body>
</html>
